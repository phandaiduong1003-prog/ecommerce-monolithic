services:
  postgres:
    image: postgres:17
    container_name: ecommerce-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: ecommerce_db

    ports:
      - "5432:5432"

    volumes:
      - ecommerce_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d ecommerce_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  ecommerce-api:
    build: .
    container_name: ecommerce-api

    ports:
      - "3001:3000"

    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/ecommerce_db?schema=public
      JWT_SECRET: ecommerce_monolithic_secret_2026
      JWT_EXPIRES_IN: 1h

    depends_on:
      postgres:
        condition: service_healthy

    command: >
      sh -c "npx prisma generate &&
             npx prisma migrate deploy &&
             npm run seed &&
             npm start"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


volumes:
  ecommerce_postgres_data: